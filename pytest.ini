[pytest]
# Repo root on sys.path so `import src.xxx` resolves (src is an implicit
# namespace package - no top-level __init__.py).
pythonpath = .
testpaths = src/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# importlib mode avoids sys.path/__init__ collisions between same-named test
# files in different stage folders.
#
# pytest-xdist is deliberately NOT enabled by default. It was (`-n auto`), and
# on a 12-core machine that made the suite appear to HANG -- 30+ minutes with
# zero output. The cause is not an unsafe test: collection alone costs ~46s and
# every worker repeats it, so `-n auto` pays 12x that up front and then thrashes.
# Measured on this repo (1008 unit tests):
#     sequential  67.7s   <- fastest
#     -n 4       103.0s
#     -n auto    >30min (killed)
# The suite is still parallel-safe (no test writes to a hardcoded non-tmp_path
# file; conftest.py holds no shared mutable state) -- xdist is simply slower
# here than the work it parallelizes. Re-measure before re-enabling it.
#
# timeout: a single wedged test can no longer masquerade as a slow suite. The
# slowest real test is ~17s (test_eval_schema setup), so 120s is pure headroom.
addopts = -ra --import-mode=importlib --timeout=120

markers =
    integration: live tests that call a real provider API (slow, cost money). Opt in explicitly: pytest --live -m integration
    offline_integration: cross-stage tests that run whole stages end to end against an injected CannedAgentProvider -- no network, no API key, no cost. Always run. Skip with -m "not offline_integration" for a unit-only run.
    slow: tests that take a long time to run

asyncio_mode = auto

filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
